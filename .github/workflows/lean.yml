name: lean-formal

on:
  push:
    paths:
      - 'formal/**'
      - 'Makefile'
      - 'docs/THEORY_FREEZE.md'
      - 'docs/REPRODUCIBILITY_MANIFEST.json'
      - 'theorem_certificates/STAGE075A_FORMAL_VERIFICATION_CERTIFICATE.md'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'formal/**'
      - 'Makefile'
      - 'docs/THEORY_FREEZE.md'
      - 'docs/REPRODUCIBILITY_MANIFEST.json'
      - 'theorem_certificates/STAGE075A_FORMAL_VERIFICATION_CERTIFICATE.md'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build pinned Lean formalization
        run: make formal
      - name: Fail on project proof escape hatches or project axioms
        run: make formal-audit
