name: lean-formal

on:
  push:
    paths:
      - 'formal/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'formal/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Lean formalization
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          leanchecker: true
