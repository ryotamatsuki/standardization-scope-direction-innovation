name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: make verify
      - run: make exposition
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-bibtex-extra poppler-utils
      - run: make paper
      - name: Build IJIO title page
        run: pdflatex -interaction=nonstopmode -halt-on-error -output-directory=submission submission/ijio_title_page.tex
      - name: Fail on unresolved LaTeX references or citations
        run: |
          if grep -E "(Citation .* undefined|Reference .* undefined|There were undefined references)" paper/main.log; then
            echo "Unresolved LaTeX citation/reference detected"
            exit 1
          fi
      - name: Stage 14 package QA
        run: python scripts/stage14_package_qa.py
      - name: PDF preflight summaries
        run: |
          pdfinfo paper/main.pdf
          pdffonts paper/main.pdf
          pdfinfo figures/policy_regime_map.pdf
          pdffonts figures/policy_regime_map.pdf
          pdfinfo submission/ijio_title_page.pdf
          pdffonts submission/ijio_title_page.pdf
      - name: Upload Stage 14 submission package
        uses: actions/upload-artifact@v4
        with:
          name: stage14-submission-package
          if-no-files-found: error
          path: |
            paper/main.pdf
            submission/ijio_title_page.pdf
            figures/policy_regime_map.pdf
            submission/ijio_highlights.txt
            submission/ijio_cover_letter.md
            submission/ijio_submission_metadata.md
            submission/ijio_declarations.md
